# Spring Application Name
spring.application.name=sumaqagro-backend

# Spring Profile
spring.profiles.active=dev

# Spring DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/sumaqagro?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA Configuration
spring.jpa.show-sql=true

# Spring JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=com.dymbia.sumaqagro.platform.shared.infrastructure.persistence.jpa.configuration.CustomPhysicalNamingStrategy

# AgroMonitoring Configuration
agromonitoring.base-url=https://api.agromonitoring.com/agro/1.0
agromonitoring.api-key=${AGROMONITORING_API_KEY}
